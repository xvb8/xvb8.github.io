<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Mother's Day</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #c9dbff, #d8c7ff, #bfe9ff, #e3d3ff);
      background-size: 300% 300%;
      animation: skyShift 14s ease-in-out infinite;
      font-family: 'Libre Baskerville', serif;
      overflow: hidden;
    }

    @keyframes skyShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
    
    h1 {
      font-size: 4rem;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      z-index: 10;
      position: relative;
      margin-bottom: 20px;
    }

    .apology {
      font-size: 1.5rem;
      color: white;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
      z-index: 10;
      position: relative;
    }
    
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background-color: #ff69b4;
      animation: fall linear forwards;
      pointer-events: none;
    }

    .balloon {
      position: fixed;
      bottom: -140px;
      width: 44px;
      height: 56px;
      border-radius: 50% 50% 45% 45%;
      opacity: 0.9;
      pointer-events: none;
      animation: rise linear forwards;
      box-shadow: inset -6px -10px 12px rgba(0, 0, 0, 0.12);
    }

    .balloon::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 54px;
      width: 10px;
      height: 8px;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.5);
      clip-path: polygon(50% 100%, 0 0, 100% 0);
    }

    .balloon-string {
      position: absolute;
      left: 50%;
      top: 60px;
      width: 24px;
      height: 80px;
      transform: translateX(-50%);
      animation: sway 2.8s ease-in-out infinite alternate;
    }

    .balloon-string svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .balloon-string path {
      fill: none;
      stroke: rgba(255, 255, 255, 0.82);
      stroke-width: 2;
      stroke-linecap: round;
    }
  </style>
</head>
<body>
  <h1>Happy Mother's Day!</h1>
  <script>
    function createConfetti() {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * window.innerWidth + 'px';
      confetti.style.top = '-12px';
      confetti.style.backgroundColor = ['#ff69b4', '#ff1493', '#ffc0cb', '#ff6347', '#ffd700', '#87ceeb'][Math.floor(Math.random() * 6)];
      confetti.style.animation = `fall ${2 + Math.random() * 1}s linear forwards`;
      document.body.appendChild(confetti);
      
      setTimeout(() => confetti.remove(), 3000);
    }

    function createBalloon() {
      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      balloon.style.left = Math.random() * (window.innerWidth - 50) + 'px';
      balloon.style.backgroundColor = ['#ff6b9d', '#ffa8d5', '#ffd166', '#9bf6ff', '#bdb2ff', '#caffbf'][Math.floor(Math.random() * 6)];
      balloon.style.animation = `rise ${6 + Math.random() * 4}s linear forwards`;
      balloon.style.transform = `scale(${0.75 + Math.random() * 0.45})`;
      const string = document.createElement('div');
      string.className = 'balloon-string';
      string.innerHTML = '<svg viewBox="0 0 24 80" aria-hidden="true"><path d="M12 0 C2 12, 22 24, 12 40 C2 56, 22 68, 12 80"/></svg>';
      balloon.appendChild(string);
      document.body.appendChild(balloon);

      setTimeout(() => balloon.remove(), 11000);
    }
    
    const style = document.createElement('style');
    style.textContent = `
      @keyframes fall {
        to {
          transform: translateY(100vh) rotate(360deg);
          opacity: 0;
        }
      }

      @keyframes rise {
        to {
          transform: translateY(-120vh);
          opacity: 0;
        }
      }

      @keyframes sway {
        from {
          transform: translateX(-50%) rotate(-4deg);
        }
        to {
          transform: translateX(-50%) rotate(4deg);
        }
      }
    `;
    document.head.appendChild(style);
    
    setInterval(createConfetti, 100);
    setInterval(createBalloon, 400);
  </script>
</body>
</html>
